      title: APC SMT1000RMI2UC Smart-UPS 1000VA LCD RM 2U 230V with SmartConnect
      description: 'APC’s SMT1000RMI2UC is part of the award winning Smart-UPS family
        which is the most popular UPS in the world for servers, storage and networks.
        APC award winning Rackmountable SMT1000RMI2UC is an affordable true sine-wave
        UPS in the Smart-UPS family. A 700w 1000va UPS designed for entry level servers
        and network equipment, it is compatible with today’s active power factor corrected
        (PFC) power supplies.Introducing APC SmartConnect - the next generation of
        Smart-UPSThe next generation of Smart-UPS™ now boast an ingenious connectivity
        feature that makes Smart-UPS even more adaptable and even easier to deploy.
        APC™ SmartConnect is an enabling feature that allows customers to view the
        status of their UPS through a secureweb portal. Through this innovative remote
        management interface, customers will receive automatic notifications, firmware
        updates, and advanced support. APC SmartConnect''s easy-to-use network connectivity
        provides added value, and more importantly, added peace of mind.FeaturesFirst
        of its kind: The APC SmartConnect feature makes Connected Smart-UPS the first
        cloud enabled UPS for distributed ITAdvice from the experts: Connected Smart-UPS
        routinely provides proactive UPS lifecycle recommendations, helping maximise
        the lifespan of your APC UPS.Accessibility: The APC SmartConnect web portal
        is accessible from any internet connected device. You''ll be able to check
        on your IT equipment on site or on the go.Enabled as a standard: APC SmartConnect
        will be automatically included on select Smart-UPS models; making it the perfect
        solution for price-conscious professionals in need of power security.Seamless
        integration: Easily integrate with leading remote monitoring and management
        solutions, so you can manage customer portfolios in a single platform.Secure,
        remote monitoringConnected Smart-UPS support remote monitoring through our
        secure web portal, so you can always be up to date on the status of your power
        infrastructure.Pro-active lifecycle alertsMaximise the life span of your UPS,
        and protect your investment, with pro-active alerts for firmware upgrade,
        device maintenance and warranty protection.Cloud enabled as standardNew Smart-UPS
        models are cloud enabled as standard, with an inbuilt ethernet port. We''ve
        made it as easy and cost effective as possible to monitor your UPS onlineTrusted
        to protect critical data and equipment from power problems by supplying clean
        and reliable network-grade power. In addition to legendary reliability and
        manageability, Smart-UPS have extremely high efficiency at low, medium and
        high load levels making them ideal for today''s multi-core or virtualised
        servers that have varying load consumption.Included PowerChute Business Edition
        software is compatible with all major server operating systems and provides
        UPS management and safe system shutdown.Main FeaturesCold-start capable- Provides
        temporary battery power when the utility power is out.Green mode - Patent-pending
        operating mode that bypasses unused electrical components in good power conditions
        to achieve very high operating efficiency without sacrificing any protection.High
        online efficiency - Reduces utility costs, generates less heat.LCD Status
        Display - Provides key UPS status at a glance. Multiple status indicators
        with load and battery bar graphs.Pure sine wave output on battery - Simulates
        utility power to provide the highest degree of compatibility for active PFC
        (power factor corrected) servers and sensitive electronics.Temperature-compensated
        battery charging - Prolongs battery life by regulating the charge voltage
        according to battery temperature.1. Alphanumeric LCD (Liquid Crystal Display)
        - IIntuitive interface provides detailed and accurate information with the
        ability to configure locally2. Communication Ports - Serial, USB, and SmartSlot™
        for accessory cards.3. 4 x IEC320 C13 Outlets 4. Push Button Circuit Breaker-
        enables quick recovery from overloads.Network Grade Power Conditioning - Automated
        voltage regulation, noise filtering and surge protection.Pure Sine-Wave Output
        - Simulates the utility when on battery for optimum device compatibility.Advanced
        battery management - Temperature compensated charging extends life of internal
        batteries.High Efficiency Green Mode - Saves utility costs and reduces heat
        promoting longer component life.APC Smart-UPS C DisplayIntuitive, easy-to-use
        LCD interface - Clear, consistent, and detailed information in your choice
        of basic or advanced menusPower StatusOperating mode and efficiencyLoad VA/Watts/AmpsInput/Output
        voltage and frequencyBattery capacity and runtimeEnergy meter and moreControl
        - UPS and outlet group settingsLanguagePower quality settingsAlarm, delay
        and threshold settings Test and Diagnostics - Initiate battery and runtime
        calibration testsLogs - See explanation of last 10 transfers and faultsAbout
        - UPS and replacement battery part numbers, serial numbers, battery install,
        and suggested replacement datesOnline Status Indicators - Online, on battery,
        fault, and replace battery LEDs for quick status identificationEscape - Exits
        to the previous menu or screenReturn - Used to enter or confirm settings.Navigation
        Arrows - Allow for quick adjustment of settings. APC UPS Network Management
        Card 2APC UPS network management cards allow for secure monitoring and control
        of an individual APC UPS via web browser, command line interface or SNMP.
        Embedded technology provides exceptional reliability with notification features
        that inform you of problems as they occur.Main FeaturesCommand line interface
        - Offers simultaneous remote management access through Telnet and SSH.Compatible
        with SmartSlot enabled UPS - Compatible with all SmartSlot UPSIPv6 Support
        - Capable of operating on a network using IPv6 protocol.Standard UPS RFC 1628
        MIB Compatible - Make UPS information available to your preferred network,
        server or enterprise management system by forwarding SNMP traps (events) using
        RFC 1628 MIB.Device Encryption - Securely connect via HTTPS/SSL, SSH (up to
        2048-bit encryption), SNMPv3.Multiple user access - Supports simultaneous
        web browser access for up to 8 users and network command line interface access
        for up to 3 users.UPS FirmwareUpdate - User friendly mechanism to remotely
        and seamlessly update UPS firmware via the web browser interface (SMX, SMT
        and SRT Smart-UPS only).Smart Battery Management Support - Detailed battery
        information including battery cartridge parameters provides early-warning
        fault analysis to simplify management of the entire battery system (SRT Smart-UPS
        only).Modbus TCP Support - Supports reporting UPS information to Building
        Management Systems or other third party management systems via Modbus TCP.Replacement
        Battery Options for this UPSAPC Replacement Battery Cartridge - RBC132This
        APC Replacement Battery Cartridge fits selected APC Smart-UPS and Back-UPS,
        restoring power back-up capacity for home offices, small businesses and IT
