      title: Fujifilm XF 27mm f/2.8 Pancake Lens
      description: For everyday momentsWith a focal length of 41mm in 35mm equivalent
        and a 55.5 degree viewing angle, this pancake lens is ideal for general use
        to capture everyday moments. With a minimum focus distance of 34cm, you can
        take up-close portraits to capture detail with this lens.Shoot in any lightWith
        a fast f/2.8 aperture, this lens captures crisp image detail even in dim light.
        Whether you’re indoors in artificial or dim light, or when lighting is low
        and uneven outdoors, you’ll still be able to capture shadows and brightness
        in your images to give them depth and clarity. The fast aperture combined
        with a 7 rounded blade diaphragm makes it possible to achieve beautiful, rounded
        bokeh for out-of-focus effects.Quick and responsive autofocusOne of the fastest
        autofocus lenses for mirrorless cameras, the Fujifilm XF 27mm f/2.8 lens delivers
        sharp images with no loss of detail. With a built-in, high-torque DC coreless
        motor, focus is accurate and efficient with this lens. You’ll always be ready
        for the action, never missing a shot. The single metal lens ring offers accurate
        manual focus capability so you can take control when you want.Sharp, clear
        imagesWith 5 elements in 4 groups, the aspherical lens element minimises chromatic
        aberrations for edge-to-edge sharpness and clear imagery. Making the most
        of Fujifilm’s X-Trans sensor, the mechanics of this XF lens produces sharp,
        crystal clear images right across the frame.Anti-reflective lens coatingThe
        HT-EBC lens coating is anti-reflective at a wider wavelength for optimum light
        transmission. Unwanted flare and ghosting are minimised to produce exceptionally
        clear, undistorted images.Light and portableWeighing in at just 78g and only
        23mm in length, this XF lens is light and portable, perfect to take around
        with you on your travels or as a walk-around lens. This everyday prime lens
        pairs well with Fujifilm X-series mirrorless cameras, ideal for a range of
        situations. The smallest and lightest of Fujifilm’s XF lenses, the Fujifilm
        27mm f/2.8 pancake lens matches the X-M1, X-Pro1 and X-E1 cameras perfectly.
      price: '639'
