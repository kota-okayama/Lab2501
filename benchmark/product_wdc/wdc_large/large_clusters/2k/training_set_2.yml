    data:
      brand: None
      title: Sony FE 24mm F1.4 GM Lens + Bonus
      description: 'The SonyFE 24mm F1.4is a fast, versatile lens well-suited to landscape,
        nature, and street photography. Its wide-but-usable perspective is complemented
        by the f/1.4 maximum aperture, which excels in low-light conditions and also
        offers increased control over depth of field. For controlling focus, a Direct
        Drive SSM (Super Sonic wave Motor) is employed that is quick and quiet, and
        also lends more responsive control for manual focus operation. The lens also
        sports a dust- and moisture-sealed design and fluorine-coated front lens element
        to support shooting in inclement conditions and a dedicated focus hold button,
        AF/MF switch, and manual aperture ring lend further control while shooting.The
        optical design incorporates three extra-low dispersion elements to reduce
        chromatic aberrations and two XA (extreme aspherical) elements, which significantly
        control spherical aberrations for a high degree of image sharpness and clarity.
        Additionally, a Nano AR coating has been applied to limit ghosting and lens
        flare for increased contrast and color fidelity when working in strong lighting
        conditions.Main Features:E-Mount Lens/Full-Frame FormatAperture Range: f/1.4
        to f/16Two XA Elements, Three ED ElementsNano AR and Fluorine CoatingsDirect
        Drive Super Sonic Wave AF MotorAF/MF Switch; Internal FocusFocus Hold ButtonPhysical
        Aperture Ring; De-Click SwitchDust and Moisture-Resistant ConstructionRounded
        11-Blade DiaphragmFIlter Thread: Front 67mmUnit Dimensions:2.97 x 3.64\" /
        75.4 x 92.4mmUnit Weight:15.70oz / 445gBonus Item - 67mm B+W Circularing Polarizing
        Filter - valued at $199.991 Year Sony Canada Warranty'
