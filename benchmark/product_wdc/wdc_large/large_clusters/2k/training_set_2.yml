      description: CRUCIAL 4GB 1600MHZ DDR3L DESKTOP SRThe 4GB (1 x 4GB) 240-Pin UDIMM
        DDR3L PC3L-12800 Memory Module Kit from Crucial is a 4GB RAM module kit. 240-pin
        DIMMs are used in DDR3 memory for desktop computers and transmits data more
        quickly than previous memory modules. A DIMM consists of a number of memory
        components (usually black) that are attached to a printed circuit board (usually
        green). The gold pins on the bottom of the DIMM provide a connection between
        the module and a socket on a larger printed circuit board. The pins on the
        front and back of a DIMM are not connected to each other.Each 240-pin DIMM
        provides a 64-bit data path. To use DDR3 memory,your system motherboard must
        have 240-pin DIMM slots and a DDR3-enabled chipset. The number of black components
        on a 240-pin DIMM can vary,but it always has 120 pins on the front and 120
        pins on the back,for a total of 240. 240-pin DIMMs are approximately 5.25\"
        long and 1.18\" high. 240-pin DDR3 DIMMS have only one notch within the row
        of pins.This high-density memory module contains 8 chips,each providing 512
        MB of RAM.Product HighlightsHigh speedLow costIncludes lifetime warrantyInstall
