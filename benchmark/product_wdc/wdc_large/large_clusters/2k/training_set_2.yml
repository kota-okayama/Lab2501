    data:
      brand: None
      title: Elixir Phosphor Bronze Acoustic Guitar Strings with NANOWEB Coating,
        Extra Light (.010-.047)
      description: Strum confidently with the same premium acoustic guitar strings
        that experienced players worldwide trust to keep their incredible tone longer
        than any other string available.Unlike other string brands, Elixir Strings
        coats the whole string. This protects not only the outer string surface but
        also the gaps between the windings where common tone-deadening gunk typically
        builds up in other brands’ coated and uncoated guitar strings. Anti-Rust Plating
        on plain steel strings ensures longer tone life for the entire set.Who wouldn’t
        love more quality playing time between the hassle and cost of string changes?Engineered
        to endure, these acoustic strings constructed with phosphor bronze wrap wire
        boast a dynamic balance of rich, full-bodied tone and sparkling high-end clarity.
        Compared to our original POLYWEB Coating, the ultra-thin NANOWEB coating allows
        a more traditionally textured, “uncoated” feel.For a slicker, gentler feel,
        try a set of strings with their original POLYWEB Coating. The 80/20 Bronze
        Acoustic Guitar Strings with POLYWEB Coating, for example, might be a good
        fit if you want a more robust and rounded tone. On the other end of the tone
        spectrum, Elixir's 80/20 Bronze Acoustic Guitar Strings with NANOWEB Coating
        deliver a brighter, crisper tone alongside the same traditional feel as these
        phosphor bronze strings.Of course, the kind of string you play is all a matter
        of personal preference. Not sure what tone or feel is right for you? Try them
        out for yourself, and find your new favorite string from Elixir Strings. Jam
        on and on (and on) with the same premium electric bass guitar strings that
        experienced players worldwide trust to keep their incredible tone longer than
        any other string available.Specially developed based on in-depth feedback
        from more than a thousand bass players just like you, Elixir Strings' tailor-made
        selection of bass strings proudly includes nickel-plated and stainless steel
        construction options, four-, five- and six-string sets, long and extra-long
        scales, and virtually every gauge range you could possibly need. All with
        their innovative string coating technology. And unlike other string brands,
        Elixir Strings coats the whole string. This protects not only the outer string
        surface but also the gaps between the windings where common tone-deadening
        gunk typically builds up in other brands’ coated and uncoated guitar strings.Who
        wouldn’t love more quality playing time between the hassle and cost of string
        changes?Premium by design, these electric bass guitar strings constructed
        with nickel-plated steel wrap wire boast a rich, rounded tone with incredible
        clarity and a heavy mid-range presence. Meanwhile, the ultra-thin NANOWEB
