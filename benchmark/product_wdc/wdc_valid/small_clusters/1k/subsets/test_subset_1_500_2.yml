      title: DJI Mavic 2 PRO Quadcopter Drone (Ready-to-Fly) - MAVIC2PRO
      description: 'DJI Mavic 2 PRO Quadcopter Drone (Ready-to-Fly) DJI’s Mavic 2
        Pro drone commands a powerful 1-inch CMOS sensor, offering higher image quality
        with superior light and colour performance. Designed by Hasselblad in collaboration
        with DJI, the new L1D-20c camera houses an adjustable-aperture lens, providing
        more control over your lighting environment. Hasselblad’s unique HNCS technology
        allows you to capture stunning 20-megapixel aerial photos with extreme detail.
        1-inch CMOS sensor The new 1-inch CMOS sensor has an active sensing area four
        times more effective than the original Mavic Pro. The large sensor also means
        better performance in low-light environments with a more extensive ISO range,
        increased from 3200 to 12800. 10-bit Dlog-M colour system Mavic 2 Pro supports
        a 10-bit Dlog-M colour profile that yields higher dynamic range for more flexibility
        in the grading room. The system records over 1 billion colours (compared to
        the 16 million colours from traditional 8-bit colour-coding technologies)
        and retains more in-depth details in both highlights and shadows. Now you
        can capture the subtlest gradations at sunset or sunrise, leaving greater
        space for post-production. HDR video and HyperLight Mavic 2 Pro records 4K
        10-bit HDR videos that have a higher dynamic range and more vivid colours,
        which can play on HLG TVs without any post-production. You can also brighten
        your world with HyperLight, a low-light setting designed to enhance images
        while significantly reducing noise. H.265 codec for higher image quality Records
        4K video at higher bitrates with advanced H.265 compression, so your images
        retain even more detail. Videos in H.265/HEVC codec maintain 50% more information
        than videos in H.264/AVC, creating high dynamic range photos with more preserved
        details. Fly further, see clearer The all-new OcuSync 2.0 provides a 1080p
        video transmission signal up to an astonishing 5 miles (8 kilometres) away,
        allowing you to fly further without constraints. Edit and upload HD footage
        directly to social media from the cache on your iPhone or iPad. You can also
        automatically save original images shot in flight to a Micro SD card. 2.4/5.8
        GHz dual signal frequency The Mavic 2 supports 2.4 to 5.8 GHz auto-switching
        for better performance in environments with busy signal interference, so you’ll
        be sure to have the best frequency for a safe and uninterrupted flight. High-bandwidth,
        low-latency OcuSync 2.0 uses a wider communication bandwidth offering a theoretical
        download speed of up to 40 Mbps and latency as low as 100ms, delivering a
        smoother video feed and overall better control experience. Powerful, yet safe
        After countless hours of research and testing, the Mavic 2’s low-noise propellers
        and newly designed chassis make it DJI’s most advanced and aerodynamic aircraft
        to date, with a body drag 19% less than that of the Mavic Pro. The result
        is increased propulsion, lower power consumption and less noise. Plus, the
        Mavic 2 boasts obstacle avoidance sensors on all sides of the aircraft. With
        a fully upgraded Flight Autonomy system, data is continually transmitted to
        a new, more powerful central processor for more accurate obstacle avoidance
        and safer flight. Features Hasselblad L1D-20C camera, 20MP 1-inch CMOS sensor
        Flies for up to 31 minutes at speeds of up to 44.74 mph (72 km/h) Records
        4K 10-bit HDR videos with a higher dynamic range and more vivid colours Omnidirectional
        obstacle sensing 10-bit Dlog-M; HDR Video, D-HDR; HyperLapse f/2.8 – f/11
        adjustable aperture 8km 1080p video transmission ActiveTrack 2.0, QuickShots,
