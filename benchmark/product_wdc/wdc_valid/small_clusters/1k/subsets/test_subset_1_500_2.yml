        find the best times for activity and rest. PULSE OX SENSOR The Pulse Ox sensor1
        gauges your blood oxygen saturation during the day and as you sleep to show
        how well your body is absorbing oxygen. STRESS TRACKING Find out if you’re
        having a calm, balanced or stressful day. Relax reminders will even prompt
        you to do a short breathing activity when you’re feeling stressed. HYDRATION
        TRACKING Log your daily fluid intake as a reminder to stay hydrated. You can
        even have an auto goal for hydration that adjusts based on how much sweat
