      brand: None
      title: Fujifilm 8-16mm f2.8 XF R LM WR Lens
      description: 'X-Mount Lens/APS-C Format12-24mm (35mm Equivalent)Aperture Range:
        f/2.8 to f/22Three ED and Three Aspherical ElementsNano-GI Lens CoatingsInternal
        Focus System11-Seal Weather-Resistant ConstructionOperates in temperatures
        as low as 14°F/-10°CThe XF8-16mmF2.8 R LM WR is a fast ultra-wide angle zoom
        lens that has a constant maximum aperture of F2.8 and is equivalent to 12-24mm
        in the 35mm format. It complements the other constant F2.8 zoom lenses (XF16-55mmF2.8
        R LM WR and XF50-140mmF2.8 R LM OIS WR) to create a premium trio of lenses
        that covers the focal lengths equivalent from 12mm all the way to 213mm in
        the 35mm format. The lens’ outstanding edge-to-edge image-resolving performance
        and F2.8 maximum aperture makes this product a perfect choice for landscape
        and architecture photography with an emphasized sense of perspective, interior
        photography at restaurants and hotels, as well as nightscape and astrophotography.The
        FUJINON XF8-16mmF2.8 R LM WR lens is able to utilize the full capability of
        FUJIFILM’s X-TransTM CMOS Sensor to achieve superb sharpness even when the
        aperture is wide open. It faithfully captures the atmosphere of each scene,
        thanks to the outstanding image-resolving performance and fast f-stop. The
        lens barrel is lightweight yet robust while also being resistant to dust,
        moisture and low temperatures down to -10 degrees Celsius, making it extremely
        reliable for professional photographers.Ultra-wide angle zoom with a constant
        maximum aperture of F2.8In order to provide an ultra-wide angle zoom of 8-16mm
        (equivalent to 12-24mm in 35mm format) at a constant maximum aperture of F2.8,
        this lens uses an impressive 20 elements in 13 groups. This includes four
        aspherical lens elements to control distortion and spherical aberration, and
        six ED lens elements including three super ED elements to control lateral
        chromatic aberration. This design results in advanced image-resolving performance
        across the zoom range while maintaining a constant maximum aperture of F2.8.Field
        curvature correction mechanismIn order to correct field curvature, typically
        found with ultra-wide angle lenses, this lens features a correction element
        which adjusts according to the position of the zoom in order to achieve edge-to-edge
        sharpness.Double Nano-GI coatingThe rear surface of the two front lens elements
        is treated with Nano-GI coating to eliminate ghosting and flare, caused by
        oblique light, creating clear images.Silent and fast autofocusThe lens uses
        linear motors for autofocus to achieve quiet and ultra-fast AF.Advanced construction
        that withstands various shooting conditionsThe barrel is sealed at 11 places
        to make the lens resistant to dust, moisture, and low temperatures down to
        -10 degrees Celsius. The front lens element is coated with fluorine to repel
        water and dirt, adding extra durability so that the lens can be used outdoors
        with peace of mind.'
      price: '1695'
      priceCurrency: GBP
