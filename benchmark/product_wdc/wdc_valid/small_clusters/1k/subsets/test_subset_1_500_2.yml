        samples your heart rate2 and will alert you if it stays high while you’re
        at rest. It also helps gauge how hard you work during activities even underwater.
        MINDFUL BREATHING When you want to relax or focus, you can start a breathwork
        activity, and this watch will track your stress and respiration to help you
        get a better understanding of how you’re breathing. ANIMATED ON-SCREEN WORKOUTS
