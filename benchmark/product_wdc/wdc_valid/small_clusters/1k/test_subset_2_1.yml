        all fenix 5 versions are water-rated to 100 metres.All fenix 5 series watches
        are packed with sophisticated training features to help monitor your form
        and performance. Enhanced readouts for Training Status and Training Effect
        show aerobic and anaerobic benefits of your workout - so you can see how your
        workouts are paying off and even compare results with your peers. The VO2
        max estimator crunches data, including your running speed, beats per minute
        and heart rate variability, to estimate the maximum volume of oxygen you can
        consume per minute. And other fitness metrics include recovery advisor with
        a recovery timer and recovery check, plus a race predictor that estimates
        your ideal finish time based on your current VO2 max number.You can customize
        any fenix 5 series watch with free downloads from Garmin's Connect IQ store
