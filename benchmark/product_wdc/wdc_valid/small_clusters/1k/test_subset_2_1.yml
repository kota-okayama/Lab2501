      title: Samsung QN50Q60T 50'' HDR 4K UHD Smart QLED TV (2020)
      description: View your favorite content at four times the resolution of 1080p
        with the Samsung Q60T 50" Class HDR 4K UHD Smart QLED TV. This TV has a 49.5"
        Quantum Dot LCD panel to produce vibrant color and incorporates Motion Rate
        120 technology to digitally enhance fast-moving images to reduce blur. It
        is compatible with the HDR10, HDR10+, and HLG HDR formats to provide a wider
        color gamut with compatible content and other equipment for more vivid images.
