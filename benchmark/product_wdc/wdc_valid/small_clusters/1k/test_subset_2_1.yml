        metrics that measure the effectiveness of your workout. It’s one smart sports
        watch you can comfortably wear anywhere - office or outback - to keep pace
        with your active lifestyle.Every fenix 5 series watch features advanced GPS
        and GLONASS satellite reception to track in more challenging environments
