        favorite apps and internet-based content, plus content sharing and screen
        mirroring with your other smart devices such as your smartphone or tablet.
        A full web browser is also onboard, allowing you to view full websites rather
        than mobile versions. With three HDMI inputs, there are multiple options for
        connecting high-definition video sources. Two USB ports are also onboard for
        connecting multimedia peripherals like flash drives. The Bixby and Amazon
        Alexa virtual assistants are built-in for simple voice control. 4K UHD QLED
        with 100% Color VolumeWith four times the resolution of Full HD, 100% color
        volume (in the DCI-P3 color space), and over a billion shades of color powered
        by Quantum Dots, you'll experience a bright, clear picture. Dual LED Backlighting
        TechnologyThis technology uses a system of dedicated warm and cool LED backlights
        to adjust the contrast and color tone, allowing you to watch your movies and
        TV shows the way they were meant to be seen. Quantum HDRQuantum HDR is designed
        to bring out detail and contrast by expanding the range of color and detail
        beyond what's possible on non-HDR TVs. The dynamic tone mapping of HDR10+
        creates deeper blacks and more vibrant imagery with compatible content and
        source devices. Quantum Processor 4K LiteThe onboard processor helps optimize
        color and contrast ratio for QLED and upscales non-4K signals to near-4K quality.
        OneRemote for Your Connected DevicesThe included OneRemote can automatically
        detect and control all compatible connected devices and content. Boundless
        DesignThe thin bezel and minimalist design of the TV helps draw you into your
        content. Universal GuideThe universal guide brings your favorite content from
        multiple compatible devices and apps together in one easy-to-browse menu.
        It recommends popular shows and can make custom recommendations tailored just
        for you. Mobile ViewThis feature splits your TV screen in two, putting the
        content you're watching on one side while mirroring your compatible mobile
        device on the other, allowing you to watch workout videos, check sports stats,
        and more while watching your favorite show or game. Choose Your Voice AssistantWith
        both Bixby and Amazon Alexa built-in, you can access your favorite content,
        get answers, and control the TV and other compatible connected devices around
        your home with just your voice. SmartThings CompatibilityThe Q60T TV works
        with SmartThings to put your in control of your compatible smart home devices.
        It links with IoT devices and sensors, enabling you to turn on the lights,
        check what's inside your refrigerator, and run the robot vacuum cleaner from
        the comfort of your couch. Game EnhancerThis function automatically adjusts
        settings to help games run smoothly. Smart TV Powered by TizenTizen provides
        a variety of apps, easy control, and various enhancements to help elevate
        your TV-watching experience. Ambient ModeThis mode is designed to complement
        your space by turning a blank screen into visuals or at-a-glance news. TV
        PlusTV Plus lets you enjoy your favorite content through virtual channels.
        Mobile ViewSend smartphone content to the TV to simultaneously display live
        and casted content, share photos, or visualize music. HDMI ConnectivityEnjoy
        high-resolution audio and video with an HDMI connection that transmits both
